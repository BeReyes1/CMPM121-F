<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>three</title>
  </head>
  <body>
    <div id="app"></div>

    <!--start screen-->
    <div id="start-screen" class="overlay visible">
      <div class="overlay-inner start-inner">
        <div class="overlay-buttons">
          <button id="start-button" class="primary-btn start-btn">Start</button>
          <button id="settings-button" class="secondary-btn">Language</button>
          <button id="mode-button" class="secondary-btn">Mode</button>
        </div>
      </div>
    </div>

    <!--end screen-->
    <div id="end-screen" class="overlay">
      <div class="overlay-inner end-inner">
        <img src="/endLight.gif" alt="Escaped!" class="end-gif" />
        <p class="end-text">You have successfully escaped, but what now?</p>
        <button id="restart-button" class="primary-btn">Play Again</button>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
